id: calvin-moltis
name: Moltis
tagline: A secure, persistent personal AI agent server
icon: https://raw.githubusercontent.com/CalvinWalzel/umbrel-community-app-store/main/gallery/calvin-moltis/logo.svg
category: ai
version: "20261023.01-patch.1"
port: 13131
description: >-
  Moltis is a persistent personal agent server written in Rust. It connects to many LLM providers (including
  OpenAI Codex and Anthropic OAuth logins), keeps long-term memory, runs scheduled tasks, speaks and listens,
  and can be reached through the web UI, Telegram, Signal, Discord, Slack, Matrix and more, with MCP tool support.


  🔒 Sandboxed commands: Shell commands the agent runs execute in throwaway containers on a private Docker daemon
  that ships with this app. They cannot see Moltis' own config, vault or sessions, and the daemon has no access to
  your umbrelOS Docker or host network.


  🧹 Clean uninstall: Everything the private Docker daemon creates (sandbox containers, images, networks) lives inside
  this app's data folder and its own network namespace, so uninstalling removes it all. No need to clean up first.


  🔑 Login: Use the password shown by umbrelOS for this app. You can add a passkey later; passkeys need HTTPS,
  so they only work when you access Moltis through an HTTPS tunnel or proxy.


  🔗 Provider OAuth: When connecting OpenAI Codex or another OAuth provider, the browser is sent to
  localhost:1455, which won't load. Copy that URL from the address bar and paste it into the field Moltis shows.
developer: Moltis
