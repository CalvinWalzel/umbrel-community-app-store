manifestVersion: 1
id: calvin-speaches
name: Speaches
tagline: Local speech-to-text with an OpenAI-compatible API
icon: https://raw.githubusercontent.com/CalvinWalzel/umbrel-community-app-store/main/gallery/calvin-speaches/logo.png
category: ai
version: "0.9.0-rc.3-patch.1"
port: 8770
description: >-
  Speaches is an OpenAI API-compatible server for speech-to-text, powered by NVIDIA Parakeet and faster-whisper.
  Any app that speaks the OpenAI audio API (POST /v1/audio/transcriptions) can use it for fully local transcription.


  🎙️ Model: Parakeet TDT 0.6B v2 (English) is downloaded on first start (~2.5 GB) and kept loaded, so the app
  takes a few minutes to become ready after installing.


  🔌 Connecting other apps: Use http://calvin-speaches_speaches_1:8000/v1 as the base URL and
  istupakov/parakeet-tdt-0.6b-v2-onnx as the model. For Moltis, use "OpenAI Whisper" under
  Settings > Voice > Speech-to-Text with that base URL and an empty API key.


  🧪 The web UI lets you test transcription in the browser.
developer: Speaches
website: https://speaches.ai
submitter: CalvinWalzel
submission: https://github.com/CalvinWalzel/umbrel-community-app-store
repo: https://github.com/speaches-ai/speaches
support: https://github.com/speaches-ai/speaches/issues
gallery: []
releaseNotes: >-
  Fixes transcription failing with "500 Internal Server Error" in apps like Moltis that request the verbose_json
  response format, which Speaches' Parakeet support rejected.
