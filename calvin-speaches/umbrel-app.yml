manifestVersion: 1
id: calvin-speaches
name: Speaches
tagline: Local speech-to-text with an OpenAI-compatible API
icon: https://raw.githubusercontent.com/CalvinWalzel/umbrel-community-app-store/main/gallery/calvin-speaches/logo.png
category: ai
version: "0.8.3"
port: 8770
description: >-
  Speaches is an OpenAI API-compatible server for speech-to-text, powered by faster-whisper. Any app that speaks the
  OpenAI audio API (POST /v1/audio/transcriptions) can use it for fully local transcription.


  🎙️ Model: Whisper large-v3-turbo (int8, CPU) is downloaded on first start (~1.6 GB) and kept loaded, so the app
  takes a few minutes to become ready after installing.


  🔌 Connecting other apps: Use http://calvin-speaches_speaches_1:8000/v1 as the base URL and
  deepdml/faster-whisper-large-v3-turbo-ct2 as the model. For Moltis, configure "Whisper (Local)" under
  Settings > Voice > Speech-to-Text.


  🧪 The web UI lets you test transcription in the browser.
developer: Speaches
