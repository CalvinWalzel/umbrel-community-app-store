version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: calvin-yattee-server_server_1
      APP_PORT: 8085
      # The Yattee apps call the API directly with HTTP Basic Auth and can't get past Umbrel's login page.
      # Yattee Server enforces its own Basic Auth on everything except /health and /info.
      PROXY_AUTH_ADD: "false"

  server:
    image: yattee/yattee-server:1.0.10@sha256:e54e36648535396c54cbe9687b51d702f698f3987cdab5ce26ba696e3e939176
    restart: on-failure
    environment:
      # Creates the admin account on every start (or resets its password), so the setup wizard is skipped.
      ADMIN_USERNAME: umbrel
      ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      # Database and the credentials encryption key.
      - ${APP_DATA_DIR}/data/app:/app/data
      # Temporary files for proxied videos.
      - ${APP_DATA_DIR}/data/downloads:/downloads
